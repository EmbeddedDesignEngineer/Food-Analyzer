  version: "3.9"

  services:
    db:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_USER:-postgres}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        POSTGRES_DB: ${POSTGRES_DB:-foodanalyzer}
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
        - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
        interval: 5s
        timeout: 5s
        retries: 5

    app:
      build: .
      restart: unless-stopped
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-foodanalyzer}
      depends_on:
        db:
          condition: service_healthy
      ports:
        - "8000:8000"

  volumes:
    pgdata: